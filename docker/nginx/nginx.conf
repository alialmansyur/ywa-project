worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 ipv6=off valid=30s;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 100M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # API (Laravel via PHP-FPM)
  server {
    listen 80 default_server;
    server_name api.tapg.local localhost 127.0.0.1 192.168.1.8;

    root /var/www/html/public;
    index index.php index.html;

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param DOCUMENT_ROOT $document_root;
      set $laravel_api_upstream laravel-api:9000;
      fastcgi_pass $laravel_api_upstream;
      fastcgi_index index.php;
      fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }

  # React Web static (production dist)
  server {
    listen 80;
    server_name dashboard.tapg.local;

    location / {
      set $react_web_upstream http://react-web:8001;
      proxy_pass $react_web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # React Admin static (production dist)
  server {
    listen 80;
    server_name admin.tapg.local;

    location / {
      set $react_admin_upstream http://react-admin:8002;
      proxy_pass $react_admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Optional services
  server {
    listen 80;
    server_name storage.tapg.local;

    location / {
      set $minio_upstream http://minio:9000;
      proxy_pass $minio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name dbadmin.tapg.local;

    location / {
      set $phpmyadmin_upstream http://phpmyadmin:80;
      proxy_pass $phpmyadmin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name _;

    location / {
      return 200 'TAPG Maintenance System - Main Nginx OK';
      add_header Content-Type text/plain;
    }
  }
}
