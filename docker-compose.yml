networks:
  tapg-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
  minio-data:
  api-vendor:
  api-storage:

services:
  mysql:
    image: mysql:8.0
    container_name: tapg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - mysql-data:/var/lib/mysql
      - ./backups/mysql:/backups
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${TOOLS_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-8006}:3306"
    networks: [tapg-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tapg-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - redis-data:/data
    ports:
      - "${TOOLS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-8007}:6379"
    networks: [tapg-network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  laravel-api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api/Dockerfile
    container_name: tapg-laravel-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      TZ: ${TZ:-Asia/Makassar}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:8005}
      FILESYSTEM_DISK: s3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - api-storage:/var/www/html/storage/app
    expose:
      - "9000"
    networks: [tapg-network]

  queue-worker:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api/Dockerfile
    container_name: tapg-queue-worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=default,notifications,exports --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - laravel-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      TZ: ${TZ:-Asia/Makassar}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_CONNECTION: redis
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - api-storage:/var/www/html/storage/app
    networks: [tapg-network]

  scheduler:
    build:
      context: ./apps/api
      dockerfile: ../../docker/api/Dockerfile
    container_name: tapg-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - laravel-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      TZ: ${TZ:-Asia/Makassar}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TIMEZONE: ${DB_TIMEZONE:-+08:00}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - api-storage:/var/www/html/storage/app
    networks: [tapg-network]

  nginx:
    image: nginx:alpine
    container_name: tapg-nginx
    restart: unless-stopped
    depends_on:
      - laravel-api
    environment:
      TZ: ${TZ:-Asia/Makassar}
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${NGINX_PORT:-8000}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/api:/var/www/html:ro
    networks: [tapg-network]

  react-web:
    image: node:20-alpine
    container_name: tapg-react-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run build && npm run preview -- --host 0.0.0.0 --port 8001"
    environment:
      TZ: ${TZ:-Asia/Makassar}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_KEY: ${VITE_REVERB_KEY:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/web:/app
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${WEB_PORT:-8001}:8001"
    networks: [tapg-network]

  react-admin:
    image: node:20-alpine
    container_name: tapg-react-admin
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run build && npm run preview -- --host 0.0.0.0 --port 8002"
    environment:
      TZ: ${TZ:-Asia/Makassar}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_KEY: ${VITE_REVERB_KEY:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/admin:/app
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${ADMIN_PORT:-8002}:8002"
    networks: [tapg-network]

  react-landing:
    image: node:20-alpine
    container_name: tapg-react-landing
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run build && npm run preview -- --host 0.0.0.0 --port 8008"
    environment:
      TZ: ${TZ:-Asia/Makassar}
      VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8002}
      VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-http://localhost:8001}
      VITE_APK_BASE_PATH: ${VITE_APK_BASE_PATH:-/apk}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-YWA Maintenance Hub}
      VITE_ENV_LABEL: ${VITE_ENV_LABEL:-LOCAL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./apps/landing:/app
      - ./apk:/app/public/apk:ro
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${LANDING_PORT:-8008}:8008"
    networks: [tapg-network]

  minio:
    image: minio/minio:latest
    container_name: tapg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Makassar}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - minio-data:/data
    ports:
      - "${TOOLS_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-8005}:9000"
      - "${TOOLS_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-8004}:9001"
    networks: [tapg-network]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tapg-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]
    environment:
      TZ: ${TZ:-Asia/Makassar}
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      PMA_ARBITRARY: 1
    ports:
      - "${TOOLS_BIND_HOST:-127.0.0.1}:${PHPMYADMIN_PORT:-8003}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks: [tapg-network]
